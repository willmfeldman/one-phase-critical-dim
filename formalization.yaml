# Theorem manifest for OnePhaseDimension, modeled on the theorem-manifest conventions used by public
# Lean formalization repositories. CI (scripts/check-formalization-manifest.rb) checks that every
# listed Lean name resolves, that each target depends on exactly axioms.expected, and that the
# challenge inventory below matches challenges/*/config.json; CI also elaborates the external
# challenge workspaces. Statement equality between challenges and solutions is checked only by
# the release comparator workflow.
schema_version: "1"
project:
  name: "OnePhaseDimension"
  title: "one-phase-critical-dim: flatness of one-homogeneous one-phase Bernoulli minimizers in dimensions at most six"
  authors:
    - "William M. Feldman"
  repository: "https://github.com/willmfeldman/one-phase-critical-dim"
  license: "Apache-2.0"
  language: "Lean"
  theorem_prover: "Lean 4"
  lean_toolchain: "leanprover/lean4:v4.35.0-rc3"
  mathlib: "v4.35.0-rc3"
  description: >-
    Lean 4 formalization of the theorem that, in dimensions 1 ≤ d ≤ 6, every nonnegative,
    nonzero, one-homogeneous global minimizer of the one-phase Bernoulli energy
    ∫ |∇v|² + 1_{v > 0} in ℝᵈ is flat, following the universal-certificate method of OpenAI,
    "The critical dimension for one-phase Bernoulli minimizers" (preprint, September 24, 2026,
    https://github.com/openai/math). The classical regularity theory it uses is proved, here or
    in the dependencies, not assumed.

dependencies:
  - name: "mathlib"
    url: "https://github.com/leanprover-community/mathlib4"
    rev: "c55e6e786f49471c72fbddbec5415808896aec1e"
  - name: "elliptic_bernoulli_foundations"
    url: "https://github.com/willmfeldman/elliptic-bernoulli-foundations"
    rev: "07a60a6f1849d6af6aff34561bcad2fbc1801190"
  - name: "inner_variational"
    url: "https://github.com/willmfeldman/bernoulli-rectifiability"
    rev: "fa255a8b5f2b904a0f4c23e19b52538e5d2b2c88"
  - name: "perron_variational"
    url: "https://github.com/willmfeldman/bernoulli-perron-variational"
    rev: "cc499ed01365a6b89009d6f9f4bbee29eb1c180c"

build:
  package_file: "lakefile.toml"
  manifest_file: "lake-manifest.json"
  root_import: "OnePhaseDimension"
  commands:
    - "lake exe cache get"
    - "lake build"

axioms:
  expected:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"

automation:
  methods:
    - method: "agent-assisted formalization"
      models:
        - "Claude Opus 5.5 (Anthropic)"
      framework: "Claude Code agentic coding workflow"
      review_status: "human-supervised"
      notes: >-
        The Lean proofs were written by AI coding agents (Claude Opus 5.5) under the author's
        direction. The author reviewed the statement of the main theorem and the textbook
        definitions used by the comparator challenge; no other Lean code was reviewed by hand.
        Correctness rests on Lean's kernel check, together with the comparator challenge in
        challenges/headline.

targets:
  - id: headline
    kind: headline-theorem
    expected_axioms: [propext, Quot.sound, Classical.choice]
    title: Flatness of one-homogeneous one-phase minimizers in dimensions at most six
    source: "OpenAI, The critical dimension for one-phase Bernoulli minimizers, preprint, September 24, 2026, https://github.com/openai/math (main theorem, flatness half). The preprint cites the classification for d ≤ 4 (Caffarelli–Jerison–Kenig 2004; Jerison–Savin 2015) and argues from a least dimension d* ∈ {5, 6}; here d = 1, 2 are proved directly, d = 3, 4 by the exclusion argument with new universal certificates on ℝ² and ℝ³, and d = 5, 6 by induction on the dimension."
    module: OnePhaseDimension.Main
    declaration: OnePhaseDimension.headline
    related_declarations:
      - OnePhaseDimension.flat_of_oneHomogeneous_of_le_six
      - OnePhaseDimension.exclusion
      - OnePhaseDimension.flatInDim_of_flatInDim_sub_one
      - OnePhaseDimension.Certificate.certificateStatement_holds
      - OnePhaseDimension.flatInDim_one
      - OnePhaseDimension.flatInDim_two
      - OnePhaseDimension.flatInDim_three
      - OnePhaseDimension.flatInDim_four
    informal: >
      For 1 ≤ d ≤ 6, every nonnegative (a.e.), not a.e. vanishing, one-homogeneous (a.e., for
      each dilation factor) global minimizer u of the one-phase energy ∫_B |∇v|² + 1_{v > 0} in
      ℝᵈ satisfies u(x) = max(⟪x, e⟫, 0) for almost every x, for some unit vector e.
    challenge: challenges/headline
    challenge_theorems:
      - OnePhaseDimension.Headline.challenge_flat_of_textbookMin
      - OnePhaseDimension.Sanity.challenge_textbookMin_halfSpace
      - OnePhaseDimension.Sanity.challenge_not_textbookMin_slope
      - OnePhaseDimension.Sanity.challenge_not_textbookMin_two_sided
      - OnePhaseDimension.Sanity.challenge_not_textbookMin_one_add_norm_sq
      - OnePhaseDimension.Sanity.challenge_textbookMin_zero
      - OnePhaseDimension.Sanity.challenge_textbookMin_shifted_halfSpace
  - id: minimizer-sanity
    kind: sanity-check
    expected_axioms: [propext, Quot.sound, Classical.choice]
    title: The minimizer class is the textbook class, and it is neither empty nor too large
    source: "H. W. Alt, L. A. Caffarelli, Existence and regularity for a minimum problem with free boundary, J. Reine Angew. Math. 325 (1981), 105–144 (the definition of a minimizer of the one-phase energy)."
    module: OnePhaseDimension.Sanity.Textbook.Equivalence
    declaration: OnePhaseDimension.Textbook.isLocalEnergyMinimizer_univ_one_iff_textbookMin
    related_declarations:
      - OnePhaseDimension.Sanity.isLocalEnergyMinimizer_max_inner
      - OnePhaseDimension.Sanity.isLocalEnergyMinimizer_zero
      - OnePhaseDimension.Sanity.isLocalEnergyMinimizer_max_inner_sub_one
    informal: >
      A function is a local energy minimizer in ℝᵈ with volume coefficient 1 if and only if, on
      every ball B, it lies in H¹(B) and minimizes ∫_B |∇v|² + 1_{v > 0} among v ∈ H¹(B) with
      v - u ∈ H¹₀(B). Half-space solutions are minimizers in every dimension; a wrong slope, the
      two-sided cone and 1 + |x|² are not; 0 and a translated half-space solution are minimizers
      that are not flat, so the hypotheses of the headline theorem are needed.
    checked_in: [challenges/headline]
    challenge_theorems:
      - OnePhaseDimension.Sanity.challenge_textbookMin_halfSpace
      - OnePhaseDimension.Sanity.challenge_not_textbookMin_slope
      - OnePhaseDimension.Sanity.challenge_not_textbookMin_two_sided
      - OnePhaseDimension.Sanity.challenge_not_textbookMin_one_add_norm_sq
      - OnePhaseDimension.Sanity.challenge_textbookMin_zero
      - OnePhaseDimension.Sanity.challenge_textbookMin_shifted_halfSpace

comparator:
  external_challenges:
    directory: "challenges"
    purpose: >-
      Comparator challenge workspaces, one per target with a challenge field (its
      challenge_theorems are the workspace's theorem_names); a target with checked_in instead is
      compared, through its challenge_theorems, in each listed workspace. In each workspace,
      Vocabulary.lean is a verbatim copy of the library file
      OnePhaseDimension/Sanity/Textbook/Defs.lean (Mathlib only; it defines the textbook class
      TextbookMin of one-phase minimizers); Challenge.lean restates it in a block generated by
      scripts/challenge-prep.py, imports only Mathlib, and states the claims with `sorry`; and
      Solution.lean imports OnePhaseDimension and proves the same statements. The workspace has
      no Lake project of its own: Vocabulary, Challenge and Solution are libraries of the root
      lakefile.toml (srcDir the workspace, not default targets).
    release_workflow: ".github/workflows/release-comparator.yml"
    comparator_revision: "fd5d5bcf14177b187f66d4502071268d877887c3"
    lean4export_revision: "66f1fb4bc256072069767fce52d39480e4524869"
    landrun_revision: "811cfff51ceaf3d9843708aa6d22e9b84ccac8b4"
    toolchain: "leanprover/lean4:v4.35.0-rc3"
    mathlib: "v4.35.0-rc3"
    permitted_axioms:
      - "propext"
      - "Classical.choice"
      - "Quot.sound"

ci:
  workflow: ".github/workflows/ci.yml"
  expected_check: "lake build --wfail, proof-integrity scan, file-size limit, manifest lean-name and exact axiom checks, challenge solution grep, and challenge workspace elaboration with solution axiom checks"
  release_workflow: ".github/workflows/release-comparator.yml"
  release_check: "actual comparator execution over every challenge config, with attestation artifact; required before any tag or GitHub release"
