name = "one_phase_dimension"
version = "0.1.2"
description = "Flatness of one-homogeneous minimizers of the one-phase Bernoulli problem in dimensions at most six"
keywords = ["math"]
defaultTargets = ["OnePhaseDimension"]
preferReleaseBuild = true

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[require]]
name = "elliptic_bernoulli_foundations"
git = "https://github.com/willmfeldman/elliptic-bernoulli-foundations"
rev = "v0.4.0"

[[require]]
name = "inner_variational"
git = "https://github.com/willmfeldman/bernoulli-rectifiability"
rev = "v0.4.2"

[[require]]
name = "perron_variational"
git = "https://github.com/willmfeldman/bernoulli-perron-variational"
rev = "v0.2.1"

[[lean_lib]]
name = "OnePhaseDimension"

# Kernel regression checks of the certificate engine (not a default target; heavy: ~150 s, ~4 GB per chunk).
[[lean_lib]]
name = "OnePhaseDimensionChecks"
roots = ["OnePhaseDimension.Certificate.Spike.Checks"]

# The comparator challenge `challenges/headline` (see challenges/README.md). Its modules are libraries of
# this package, so the challenge is checked from the repository root. Not default targets: `lake build`
# builds only `OnePhaseDimension`. `Solution` declares the same names as `Vocabulary`; nothing imports both.
[[lean_lib]]
name = "Vocabulary"
srcDir = "challenges/headline"

# The first line of Challenge.lean's generated vocabulary block (scripts/challenge-prep.py) is longer
# than the Mathlib style limit; it is not hand-written, so the line-length linter is off here.
[[lean_lib]]
name = "Challenge"
srcDir = "challenges/headline"
leanOptions = { weak.linter.style.longLine = false }

[[lean_lib]]
name = "Solution"
srcDir = "challenges/headline"
