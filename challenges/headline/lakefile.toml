name = "headline"
version = "0.1.0"
# Keep `lake build` safe for the comparator workflow: it elaborates only the
# trusted statement surface. `check.sh` builds `Solution` explicitly in a
# trusted checkout.
defaultTargets = ["Vocabulary", "Challenge"]
# Share the root workspace's dependency checkouts and builds; the manifests
# lock identical revisions.
packagesDir = "../../.lake/packages"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "one_phase_dimension"
path = "../.."

[[lean_lib]]
name = "Vocabulary"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
